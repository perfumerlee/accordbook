<!doctype html>
<html lang="ko">
<head>
  <base target="_top">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body { margin: 0; background: #eee8dc; color: #302a26; font: 15px Georgia, serif; }
    main { max-width: 1180px; margin: auto; padding: 36px 24px; }
    h1 { font-size: 32px; margin: 0 0 8px; }
    h2 { margin-top: 34px; border-top: 1px solid #c8bdad; padding-top: 22px; }
    .eyebrow, th { font: 700 12px monospace; letter-spacing: .12em; text-transform: uppercase; color: #895437; }
    .cards { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
    .card { border: 1px solid #c8bdad; padding: 18px; background: #f5f0e7; }
    .num { font-size: 30px; margin-top: 8px; }
    table { width: 100%; border-collapse: collapse; background: #f5f0e7; }
    th, td { text-align: left; padding: 12px; border-bottom: 1px solid #d8cdbd; }
    button { font: inherit; background: none; border: 1px solid #9e9283; padding: 10px 14px; cursor: pointer; }
    button:hover, button:focus { background: #e2d8ca; }
    .muted { color: #75695e; }
    .error { color: #8a3428; }
    label { display: block; margin: 14px 0 6px; font-weight: bold; }
    input, textarea { box-sizing: border-box; width: 100%; padding: 10px; margin-top: 6px; border: 1px solid #b8aa99; background: #faf7f0; color: #302a26; font: inherit; }
    textarea { min-height: 120px; resize: vertical; }
    .edit-form { max-width: 760px; margin-top: 24px; padding: 24px; border: 1px solid #c8bdad; background: #f5f0e7; }
    .status-meta { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; margin-top: 22px; }
    .status-meta > div { border: 1px solid #c8bdad; padding: 16px; background: #f5f0e7; }
    .status-meta strong { display: block; margin-top: 8px; font-size: 22px; font-weight: normal; }
    .status-meta small { display: block; margin-top: 8px; color: #75695e; }
    .status-note { color: #895437; margin: 14px 0 0; }
    .form-actions { margin-top: 22px; }
    button:disabled { cursor: wait; opacity: .55; }
    .publication { margin: 30px 0; padding-bottom: 28px; border-bottom: 1px solid #c8bdad; }
    .publication-controls { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
    .publication-controls label { font-weight: normal; }
    .publication-controls input { width: auto; }
    .og-preview { position: relative; aspect-ratio: 1200 / 630; width: 100%; max-width: 720px; box-sizing: border-box; background: #e8e1d5; border: 1px solid #c8bdad; overflow: hidden; margin: 18px 0; }
    .og-preview-canvas { position: absolute; left: 0; top: 0; width: 1200px; height: 630px; transform-origin: 0 0; background-color: #e8e1d5; background-image: linear-gradient(#bdb1a1, #bdb1a1), linear-gradient(#bdb1a1, #bdb1a1); background-position: center 115px, center 534px; background-size: calc(100% - 64px) 1px; background-repeat: no-repeat; overflow: hidden; }
    .og-preview-canvas::after { content: ''; position: absolute; z-index: 0; left: 860px; top: 205px; width: 280px; height: 280px; opacity: .055; background: url('https://accordbook.org/favicon.svg') center / contain no-repeat; pointer-events: none; }
    .og-preview-canvas header, .og-preview-canvas footer { position: absolute; z-index: 1; left: 80px; right: 80px; display: flex; justify-content: space-between; gap: 12px; overflow: hidden; white-space: nowrap; font: 25px/1 monospace; letter-spacing: .1em; color: #6f527f; }
    .og-preview-canvas header { top: 70px; padding-bottom: 16px; }
    .og-preview-canvas strong, .og-preview-canvas p { z-index: 1; }
    .og-preview-canvas strong { position: absolute; left: 80px; width: 1040px; top: 186px; display: block; color: #332d27; font: normal 58px/1.22 Georgia, serif; overflow-wrap: anywhere; }
    .og-preview-canvas p { position: absolute; left: 80px; width: 900px; top: 300px; margin: 0; color: #5f5348; font: 28px/1.22 Georgia, serif; overflow-wrap: anywhere; }
    .og-preview-canvas footer { bottom: 48px; padding-top: 16px; color: #5f5348; }
    .og-preview-canvas footer span:first-child { font-size: 30px; color: #332d27; }
    .og-custom { max-width: 720px; width: 100%; aspect-ratio: 1200 / 630; object-fit: cover; display: block; margin: 18px 0; }
    .publication-message { min-height: 1.5em; overflow-wrap: anywhere; }
    .publication-diff { max-width: 520px; margin: 16px 0; padding: 12px 0; border-top: 1px solid #d8cdbd; border-bottom: 1px solid #d8cdbd; }
    .publication-diff .eyebrow { margin: 0 0 8px; }
    .publication-diff > div { display: flex; justify-content: space-between; gap: 20px; padding: 4px 0; font: 12px monospace; }
    .publication-diff strong { font-weight: normal; color: #75695e; }
    @media (max-width: 700px) {
      main { padding: 24px 14px; }
      .cards { grid-template-columns: repeat(2, 1fr); }
      table { font-size: 13px; display: block; overflow: auto; white-space: nowrap; }
      h1 { font-size: 26px; }
      .status-meta { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">Accordbook Formula Drop Admin · v13</div>
    <h1>Formula Drop 운영 대시보드</h1>
    <p id="state" class="muted">Formula Drop 데이터를 불러오는 중…</p>
    <section id="app"></section>
  </main>

  <script>
    const $ = (id) => document.getElementById(id);

    const esc = (value) => String(value ?? '').replace(/[&<>"']/g, (character) => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[character]));

    const percent = (value) => value == null ? '—' : `${Number(value).toFixed(1)}%`;

    function statusLabel(status, kind) {
      const rawLabels = { DRAFT: '초안 (DRAFT)', SCHEDULED: '공개 예정 (SCHEDULED)', ACTIVE: '활성화 (ACTIVE)', EXPIRED: '종료됨 (EXPIRED)' };
      const effectiveLabels = { DRAFT: '비공개 (DRAFT)', SCHEDULED: '공개 예정 (SCHEDULED)', ACTIVE: '공개 중 (ACTIVE)', EXPIRED: '종료됨 (EXPIRED)' };
      return (kind === 'effective' ? effectiveLabels : rawLabels)[status] || '설정 확인 필요 (INVALID)';
    }

    function statusMismatchMessage(rawStatus, effectiveStatus) {
      if (rawStatus === effectiveStatus) return '';
      if (effectiveStatus === 'EXPIRED') return '종료 시간이 지나 현재는 공개되지 않습니다.';
      if (effectiveStatus === 'SCHEDULED') return '시작 시간이 아직 되지 않아 현재는 공개되지 않습니다.';
      if (effectiveStatus === 'INVALID') return '공개 기간 설정을 확인해야 합니다.';
      return '관리 설정과 현재 공개 상태가 다릅니다.';
    }

    const labels = {
      source: '유입 경로',
      uniqueVisitors: '고유 방문자',
      uniqueDownloaders: '고유 다운로드 사용자',
      uniqueImporters: '고유 Import 사용자',
      reason: '실패 원인',
      count: '횟수',
    };

    function loadDashboard() {
      $('state').textContent = 'Formula Drop 데이터를 불러오는 중…';
      google.script.run
        .withSuccessHandler(renderDashboard)
        .withFailureHandler(() => {
          $('state').innerHTML = '<span class="error">대시보드 데이터를 불러오지 못했습니다.</span> <button onclick="loadDashboard()">다시 시도</button>';
        })
        .getFormulaDropDashboardData();
    }

    function metricCard(label, value) {
      return `<div class="card"><div class="eyebrow">${label}</div><div class="num">${value}</div></div>`;
    }

    function renderDashboard(data) {
      $('state').textContent = data.active.length ? '활성 Drop' : '활성 상태의 Formula Drop이 없습니다.';
      const active = data.active[0];
      const metrics = active?.metrics;

      let html = '<button onclick="createDraft()">새 Formula Drop 만들기</button>';
      if (active) {
        html += `<h2>활성 Drop</h2><p><b>${esc(active.dropId)}</b> · ${esc(active.title)} · ${esc(statusLabel(active.effectiveStatus, 'effective'))}</p><div class="cards">
          ${metricCard('고유 방문자', metrics.uniqueVisitors)}
          ${metricCard('고유 다운로드 사용자', metrics.uniqueDownloaders)}
          ${metricCard('고유 Import 사용자', metrics.uniqueImporters)}
          ${metricCard('방문 → 다운로드', percent(metrics.visitToDownload))}
          ${metricCard('다운로드 → Import', percent(metrics.downloadToImport))}
          ${metricCard('방문 → Import', percent(metrics.visitToImport))}
          ${metricCard('전체 다운로드', metrics.totalDownloads)}
          ${metricCard('Import 실패', metrics.importFailures)}
        </div>`;
      }

      html += `<h2>최근 Drop</h2><table><tr><th>Drop</th><th>제목</th><th>관리 설정</th><th>현재 공개 상태</th><th>방문자</th><th>다운로드</th><th>Import</th><th>방문 → Import</th></tr>`;
      html += data.drops.map((drop) => `<tr><td><button onclick="showDetail('${esc(drop.dropId)}')">${esc(drop.dropId)}</button></td><td>${esc(drop.title)}</td><td>${esc(statusLabel(drop.status, 'raw'))}</td><td>${esc(statusLabel(drop.effectiveStatus, 'effective'))}</td><td>${drop.metrics.uniqueVisitors}</td><td>${drop.metrics.uniqueDownloaders}</td><td>${drop.metrics.uniqueImporters}</td><td>${percent(drop.metrics.visitToImport)}</td></tr>`).join('');
      html += '</table>';
      $('app').innerHTML = html;
    }

    function showDetail(dropId) {
      google.script.run
        .withSuccessHandler(renderDetail)
        .withFailureHandler(() => alert('Drop 상세 데이터를 불러오지 못했습니다.'))
        .getFormulaDropDetail(dropId);
    }

    function resetMetrics(dropId) {
      if (!confirm('이 DROP의 수치를 지금부터 새로 집계할까요? 기존 이벤트 원본은 삭제되지 않습니다.')) return;
      google.script.run
        .withSuccessHandler((result) => result.ok ? showDetail(dropId) : alert('수치를 초기화할 수 없습니다: ' + result.error))
        .withFailureHandler(() => alert('수치 초기화에 실패했습니다.'))
        .resetFormulaDropMetrics(dropId);
    }

    function createDraft() {
      google.script.run
        .withSuccessHandler((result) => result.ok ? openEditor(result.dropId) : alert('생성할 수 없습니다: ' + result.error))
        .withFailureHandler(() => alert('Drop 생성에 실패했습니다.'))
        .createFormulaDropDraft({});
    }

    function renderDetail(data) {
      const metrics = data.metrics;
      $('state').textContent = `${data.drop.dropId} · ${statusLabel(data.drop.effectiveStatus, 'effective')}`;
      window.adminDropSummaries = window.adminDropSummaries || {};
      window.adminDropSummaries[data.drop.dropId] = data.drop;
      const editButton = data.drop.status === 'EXPIRED' ? `<button onclick="openConfigViewer('${esc(data.drop.dropId)}')">Drop 설정 보기</button>` : `<button onclick="openEditor('${esc(data.drop.dropId)}')">Drop 편집</button>`;
      const actions = editButton + (data.drop.status === 'DRAFT' ? ` <button onclick="changeStatus('activate', '${esc(data.drop.dropId)}', '${esc(data.drop.updatedAt)}')">Drop 활성화</button> <button onclick="changeStatus('schedule', '${esc(data.drop.dropId)}', '${esc(data.drop.updatedAt)}')">예약하기</button>` : data.drop.status === 'SCHEDULED' ? ` <button onclick="changeStatus('activate', '${esc(data.drop.dropId)}', '${esc(data.drop.updatedAt)}')">Drop 활성화</button> <button onclick="changeStatus('draft', '${esc(data.drop.dropId)}', '${esc(data.drop.updatedAt)}')">초안으로 되돌리기</button>` : data.drop.status === 'ACTIVE' ? ` <button onclick="changeStatus('expire', '${esc(data.drop.dropId)}', '${esc(data.drop.updatedAt)}')">Drop 종료</button>` : '');
      const statusMessage = statusMismatchMessage(data.drop.status, data.drop.effectiveStatus);
      $('app').innerHTML = `<button onclick="loadDashboard()">← 대시보드로 돌아가기</button> ${actions}<h2>${esc(data.drop.dropId)}</h2><p>${esc(data.drop.title)}</p><div class="status-meta"><div><div class="eyebrow">관리 설정</div><strong>${esc(statusLabel(data.drop.status, 'raw'))}</strong><small>Admin에서 지정한 상태</small></div><div><div class="eyebrow">현재 공개 상태</div><strong>${esc(statusLabel(data.drop.effectiveStatus, 'effective'))}</strong><small>기간을 반영한 실제 공개 상태</small></div></div>${statusMessage ? `<p class="status-note">${esc(statusMessage)}</p>` : ''}<section class="card" style="margin-top:24px"><div class="eyebrow">LICENSE</div><p id="license-status-${esc(data.drop.dropId)}">STATUS · 확인 중…</p><p id="license-warning-${esc(data.drop.dropId)}" class="status-note" hidden></p><button id="license-refresh-${esc(data.drop.dropId)}" onclick="refreshLicenseStatus('${esc(data.drop.dropId)}')">상태 새로고침</button><div id="license-actions-${esc(data.drop.dropId)}"></div></section><div class="cards">
        ${metricCard('고유 방문자', metrics.uniqueVisitors)}
        ${metricCard('고유 다운로드 사용자', metrics.uniqueDownloaders)}
        ${metricCard('고유 Import 사용자', metrics.uniqueImporters)}
        ${metricCard('전체 조회', metrics.totalViews)}
        ${metricCard('전체 다운로드', metrics.totalDownloads)}
        ${metricCard('반복 다운로드', metrics.repeatDownloads)}
        ${metricCard('Import 시도', metrics.importAttempts)}
        ${metricCard('Import 성공', metrics.totalImportSuccesses)}
        ${metricCard('Import 실패', metrics.importFailures)}
        ${metricCard('방문 → 다운로드', percent(metrics.visitToDownload))}
        ${metricCard('다운로드 → Import', percent(metrics.downloadToImport))}
        ${metricCard('방문 → Import', percent(metrics.visitToImport))}
      </div><h2>유입 경로별 분석</h2>${renderTable(data.sources, ['source', 'uniqueVisitors', 'uniqueDownloaders', 'uniqueImporters'])}<h2>Import 실패 원인</h2>${renderTable(data.failures, ['reason', 'count'])}`;
      $('app').insertAdjacentHTML('afterbegin', `<button onclick="resetMetrics('${esc(data.drop.dropId)}')">이 DROP 수치 초기화</button>`);
      refreshLicenseStatus(data.drop.dropId);
      $('license-status-' + data.drop.dropId).closest('section').insertAdjacentHTML('afterend', '<section class="publication" id="publication"><h2>PUBLIC ARCHIVE / SOCIAL PREVIEW</h2><p role="status">저장소 상태 확인 중…</p></section>');
      loadPublication(data.drop.dropId);
    }

    function licenseStatusLabel(result) {
      const labels = { active: 'ACTIVE', revoked: 'REVOKED', missing_license_id: 'NOT CONNECTED', not_found: 'NOT FOUND', license_not_found: 'NOT FOUND', registry_not_found: 'NOT FOUND', ambiguous_drop_license_mapping: 'CONFIGURATION ISSUE', ambiguous_license: 'CONFIGURATION ISSUE', registry_ambiguous: 'CONFIGURATION ISSUE', registry_not_configured: 'NOT CONFIGURED', registry_unavailable: 'UNAVAILABLE', registry_invalid_response: 'UNAVAILABLE', registry_unauthorized: 'AUTHORIZATION ERROR', authorization_failed: 'AUTHORIZATION ERROR', invalid_request: 'CONFIGURATION ISSUE' };
      return labels[result.error] || 'UNAVAILABLE';
    }

    function refreshLicenseStatus(dropId) {
      refreshLicenseStatusAttempt(dropId, 0);
    }

    function refreshLicenseStatusAttempt(dropId, retryCount) {
      const statusNode = $('license-status-' + dropId);
      const button = $('license-refresh-' + dropId);
      if (!statusNode || !button || (button.disabled && retryCount === 0)) return;
      button.disabled = true;
      statusNode.textContent = 'STATUS · 확인 중…';
      google.script.run.withSuccessHandler((result) => {
        if (!result.ok && retryCount < 1 && ['registry_unavailable', 'registry_invalid_response'].includes(result.error)) {
          statusNode.textContent = 'STATUS · 다시 확인 중…';
          window.setTimeout(() => refreshLicenseStatusAttempt(dropId, retryCount + 1), 800);
          return;
        }
        statusNode.textContent = result.ok ? 'STATUS · ' + result.status.toUpperCase() : 'STATUS · ' + licenseStatusLabel(result);
        renderLicenseActions(dropId, result);
        renderLicenseWarning(dropId, result);
        button.disabled = false;
      }).withFailureHandler(() => {
        if (retryCount < 1) {
          statusNode.textContent = 'STATUS · 다시 확인 중…';
          window.setTimeout(() => refreshLicenseStatusAttempt(dropId, retryCount + 1), 800);
          return;
        }
        statusNode.textContent = 'STATUS · UNAVAILABLE';
        renderLicenseActions(dropId, { ok: false, error: 'registry_unavailable' });
        renderLicenseWarning(dropId, { ok: false });
        button.disabled = false;
      }).getFormulaDropLicenseStatus(dropId);
    }

    function renderLicenseWarning(dropId, result) {
      const node = $('license-warning-' + dropId); const drop = window.adminDropSummaries && window.adminDropSummaries[dropId];
      if (!node || !drop || !result || !result.ok || drop.status !== 'ACTIVE' || result.status !== 'revoked') { if (node) { node.textContent = ''; node.hidden = true; } return; }
      node.textContent = '운영 상태 확인 필요: 현재 Formula Drop은 공개 중이지만 연결된 라이선스는 폐기되었습니다. 사용자는 파일을 다운로드할 수 있지만 새 Import는 실패할 수 있습니다. Drop 종료를 진행하세요.';
      node.hidden = false;
    }

    function renderLicenseActions(dropId, result) {
      const node = $('license-actions-' + dropId); const drop = window.adminDropSummaries && window.adminDropSummaries[dropId];
      if (!node || !drop || !result || !result.ok || (result.status !== 'active')) { if (node) node.innerHTML = ''; return; }
      const label = drop.status === 'ACTIVE' ? 'CLOSE & REVOKE' : drop.status === 'EXPIRED' ? 'REVOKE LICENSE' : '';
      node.innerHTML = label ? `<button class="danger-action" onclick="requestLicenseRevoke('${esc(dropId)}', '${esc(drop.status)}', '${esc(drop.updatedAt)}')">${label}</button>` : '';
    }

    function requestLicenseRevoke(dropId, rawStatus, updatedAt) {
      const typed = prompt(`계속하려면 ${dropId} 를 정확히 입력하세요.\n이 작업은 되돌릴 수 없습니다.`);
      if (typed !== dropId) { if (typed !== null) alert('Drop ID가 일치하지 않습니다.'); return; }
      const method = rawStatus === 'ACTIVE' ? 'closeAndRevokeFormulaDrop' : 'retryFormulaDropLicenseRevoke';
      const args = rawStatus === 'ACTIVE' ? [dropId, updatedAt, typed] : [dropId, typed];
      const runner = google.script.run.withSuccessHandler(result => {
        if (result.ok) { alert('처리가 완료되었습니다.'); showDetail(dropId); }
        else if (result.result === 'partial') { alert('Drop은 종료되었지만 License revoke가 완료되지 않았습니다. 상세 화면에서 다시 시도해 주세요.'); showDetail(dropId); }
        else alert('처리할 수 없습니다: ' + result.error);
      }).withFailureHandler(() => alert('처리 중 오류가 발생했습니다.'));
      if (method === 'closeAndRevokeFormulaDrop') runner.closeAndRevokeFormulaDrop(args[0], args[1], args[2]);
      else runner.retryFormulaDropLicenseRevoke(args[0], args[1]);
    }

    function changeStatus(action, dropId, updatedAt) {
      if (!confirm('이 Drop의 상태를 변경하시겠습니까?')) return;
      const methods = { activate: 'activateFormulaDrop', schedule: 'scheduleFormulaDrop', draft: 'returnFormulaDropToDraft', expire: 'expireFormulaDrop' };
      google.script.run
        .withSuccessHandler((result) => result.ok ? showDetail(dropId) : alert('상태를 변경할 수 없습니다: ' + result.error))
        .withFailureHandler(() => alert('상태 변경에 실패했습니다.'))[methods[action]](dropId, updatedAt);
    }

    function openEditor(dropId) {
      google.script.run.withSuccessHandler((config) => {
        if (!config || config.dropId !== dropId || !['DRAFT', 'SCHEDULED', 'ACTIVE'].includes(config.status) || typeof config.title !== 'string') {
          alert('편집 데이터를 정상적으로 받지 못했습니다. 저장하지 말고 Admin 서버 코드를 확인해 주세요.');
          return;
        }
        renderEditor(config, false);
      }).withFailureHandler(() => alert('편집 정보를 불러오지 못했습니다.')).getFormulaDropAdminConfig(dropId);
    }

    function openConfigViewer(dropId) {
      google.script.run.withSuccessHandler((config) => {
        if (!config || config.dropId !== dropId || config.status !== 'EXPIRED' || typeof config.title !== 'string') {
          alert('설정 정보를 정상적으로 받지 못했습니다.');
          return;
        }
        renderEditor(config, true);
      }).withFailureHandler(() => alert('설정 정보를 불러오지 못했습니다.')).getFormulaDropAdminConfig(dropId);
    }

    function renderEditor(config, readOnly) {
      window.editValidationErrors = {};
      window.editOperationalError = '';
       const lockedAssets = readOnly || config.status !== 'DRAFT';
       const lockedStart = readOnly || config.status === 'ACTIVE';
       const lockedText = readOnly;
       const field = (label, name, value, type = 'text', disabled = false) => `<label>${label}<input id="edit-${name}" name="${name}" type="${type}" value="${esc(value || '')}" ${disabled ? 'disabled' : ''} aria-invalid="false" aria-describedby="error-${name}"></label><small id="error-${name}" class="error" hidden></small>`;
       $('app').innerHTML = `<button onclick="showDetail('${esc(config.dropId)}')">← 상세로 돌아가기</button><h2>${readOnly ? 'Formula Drop 설정 보기' : 'Formula Drop 편집'}</h2><p>${esc(config.dropId)} · ${esc(config.status)}</p><form id="edit-form" onsubmit="saveEditor(event, '${esc(config.dropId)}', '${esc(config.updatedAt)}', '${esc(config.status)}')">${field('제목', 'title', config.title, 'text', lockedText)}${field('부제목', 'subtitle', config.subtitle, 'text', lockedText)}<label>설명<textarea id="edit-description" name="description" ${lockedText ? 'disabled' : ''} aria-invalid="false" aria-describedby="error-description">${esc(config.description || '')}</textarea></label><small id="error-description" class="error" hidden></small>${field('시작 시각', 'startAt', config.startAt, 'datetime-local', lockedStart)}${field('종료 시각', 'expiresAt', config.expiresAt, 'datetime-local', lockedText)}${field('파일명', 'fileName', config.fileName, 'text', lockedAssets)}${field('파일 URL', 'fileUrl', config.fileUrl, 'url', lockedAssets)}${field('License ID', 'licenseId', config.licenseId, 'text', lockedAssets)}${field('공용 Access Name', 'publicAccessName', config.publicAccessName, 'text', lockedAssets)}${field('공용 전화번호 끝 4자리', 'publicAccessLast4', config.publicAccessLast4, 'text', lockedAssets)}${field('공용 PIN', 'publicAccessPin', config.publicAccessPin, 'text', lockedAssets)}<p id="edit-error" class="error" hidden></p><button type="button" onclick="showDetail('${esc(config.dropId)}')">돌아가기</button>${readOnly ? '' : ' <button id="save-edit" type="submit">변경사항 저장</button>'}</form>`;
       document.querySelectorAll('#edit-form input:not(:disabled), #edit-form textarea:not(:disabled)').forEach((element) => {
        element.addEventListener('input', () => validateEditorField(element.name));
        element.addEventListener('change', () => validateEditorField(element.name));
      });
    }

    function getEditorFieldValue(name) {
      return document.querySelector(`#edit-form [name="${name}"]`)?.value ?? '';
    }

    function validateEditorField(name) {
      const value = getEditorFieldValue(name);
      let message = '';
      if (name === 'title' && !value.trim()) message = '제목은 필수입니다.';
      if (name === 'publicAccessLast4' && value && !/^\d{4}$/.test(value)) message = '정확히 4자리 숫자여야 합니다.';
      if (name === 'publicAccessPin' && value && !/^\d{6}$/.test(value)) message = '정확히 6자리 숫자여야 합니다.';
      if (name === 'licenseId' && value && !/^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i.test(value)) message = '유효한 UUID가 아닙니다.';
      if (name === 'fileUrl' && value && !/^https:\/\/[^\s]+$/i.test(value)) message = 'HTTPS URL만 사용할 수 있습니다.';
      if (name === 'fileName' && value && !/\.accordbook$/i.test(value)) message = '.accordbook 파일명이어야 합니다.';
      if (name === 'expiresAt' && getEditorFieldValue('startAt') && value && new Date(value) <= new Date(getEditorFieldValue('startAt'))) message = '종료 시각은 시작 시각보다 늦어야 합니다.';
      if (message) window.editValidationErrors[name] = message;
      else delete window.editValidationErrors[name];
      renderEditorErrors();
      return message;
    }

    function renderEditorErrors() {
      const errors = window.editValidationErrors || {};
      document.querySelectorAll('[id^="error-"]').forEach((node) => {
        const name = node.id.slice('error-'.length);
        const message = errors[name] || '';
        node.textContent = message;
        node.hidden = !message;
      });
      Object.keys(errors).forEach((name) => {
        const field = document.querySelector(`#edit-form [name="${name}"]`);
        if (field) field.setAttribute('aria-invalid', 'true');
      });
      document.querySelectorAll('#edit-form [name]').forEach((field) => {
        if (!errors[field.name]) field.setAttribute('aria-invalid', 'false');
      });
      const general = $('edit-error');
      if (general) {
        general.textContent = window.editOperationalError || '';
        general.hidden = !window.editOperationalError;
      }
    }

    function saveEditor(event, dropId, expectedUpdatedAt, status) {
      event.preventDefault();
      const form = event.currentTarget;
      const value = name => form.elements[name]?.value ?? '';
      window.editValidationErrors = {};
      window.editOperationalError = '';
      ['title', 'publicAccessLast4', 'publicAccessPin', 'licenseId', 'fileUrl', 'fileName', 'expiresAt'].forEach(validateEditorField);
      if (Object.keys(window.editValidationErrors).length) return;
      renderEditorErrors();
      const button = $('save-edit'); button.disabled = true; button.textContent = '저장 중…';
      const patch = {}; ['title', 'subtitle', 'description', 'startAt', 'expiresAt', 'fileName', 'fileUrl', 'licenseId', 'publicAccessName', 'publicAccessLast4', 'publicAccessPin'].forEach(name => { const element = form.elements[name]; if (element && !element.disabled) patch[name] = element.value; });
      google.script.run.withSuccessHandler(result => { if (result.ok) { window.editValidationErrors = {}; window.editOperationalError = ''; showDetail(dropId); } else { button.disabled = false; button.textContent = '변경사항 저장'; window.editValidationErrors = result.fields || {}; window.editOperationalError = result.error === 'conflict' ? '이 Drop이 다른 창에서 변경되었습니다. 최신 내용을 다시 불러오세요.' : result.error === 'license_policy_not_confirmed' ? '공용 라이선스 정책을 확인하지 못해 저장하지 않았습니다. Registry 배포·연결 설정과 라이선스 상태를 확인한 후 다시 저장하세요.' : result.fields ? '' : '저장할 수 없습니다: ' + result.error; renderEditorErrors(); } }).withFailureHandler(() => { button.disabled = false; button.textContent = '변경사항 저장'; window.editOperationalError = '저장에 실패했습니다.'; renderEditorErrors(); }).updateFormulaDrop(dropId, expectedUpdatedAt, patch);
    }

    function renderTable(rows, columns) {
      if (!rows.length) return '<p class="muted">데이터가 없습니다.</p>';
      return `<table><tr>${columns.map((column) => `<th>${labels[column]}</th>`).join('')}</tr>${rows.map((row) => `<tr>${columns.map((column) => `<td>${esc(row[column])}</td>`).join('')}</tr>`).join('')}</table>`;
    }

    let publication = null;
    function publicationMessage(error) {
      return ({ github_not_configured: 'GitHub 발행 설정이 필요합니다. 일반 저장은 계속 사용할 수 있습니다.',
        conflict: 'Drop 또는 저장소가 변경되었습니다. 상태를 다시 확인한 뒤 발행하세요.',
        github_auth: 'GitHub 권한 또는 브랜치 보호 설정을 확인하세요.',
        invalid_png: 'PNG를 확인하세요: 최대 5 MiB, 최소 600 × 315, 최대 40 MP, 애니메이션 불가.',
        image_required: 'CUSTOM 모드에는 PNG가 필요합니다.', not_publishable: '공개 중 또는 종료된 Drop만 발행할 수 있습니다. 제목과 설명도 필요합니다.',
        repository_content_invalid: '저장소의 공개 JSON/이미지 형식을 확인하세요.' })[error] || '발행 상태를 확인할 수 없습니다. 변경사항은 저장소에 반영되지 않았을 수 있으므로 상태를 다시 확인하세요.';
    }
    function autoOgPreview(snapshot) {
      return `<div class="og-preview" role="img" aria-label="AUTO social preview 근사 예시"><div class="og-preview-canvas"><header><span>FORMULA DROP</span><span>NO. ${esc(snapshot.slug)}</span></header><strong>${esc(snapshot.title)}</strong><p>${esc(snapshot.subtitle)}</p><footer><span>ACCORDBOOK</span><span>A PUBLIC FORMULA STUDY</span></footer></div></div>`;
    }
    function loadPublication(dropId) {
      const host = $('publication');
      if (!host) return;
      if (publication?.objectUrl) URL.revokeObjectURL(publication.objectUrl);
      const state = { dropId, host, busy: false, file: null, objectUrl: null };
      publication = state;
      const receive = result => {
        if (publication !== state || !host.isConnected) return;
        state.data = result; state.mode = result.mode || 'AUTO'; renderPublication();
      };
      google.script.run.withSuccessHandler(receive).withFailureHandler(() => receive({ ok: false })).getFormulaDropPublication(dropId);
    }
    function publicationDiff(data) {
      if (!data.comparison || data.status !== 'CHANGES NOT PUBLISHED') return '';
      const labels = { slug: 'SLUG', title: 'TITLE', subtitle: 'SUBTITLE', description: 'DESCRIPTION', expiresAt: 'EXPIRES AT', socialPreview: 'SOCIAL PREVIEW' };
      return `<section class="publication-diff"><p class="eyebrow">PUBLIC CHANGES</p>${Object.keys(labels).map(key => `<div><span>${labels[key]}</span><strong>${data.comparison.fields[key]?.status === 'modified' ? 'MODIFIED' : 'SAME'}</strong></div>`).join('')}</section>`;
    }
    function renderPublication() {
      const state = publication, data = state.data, host = state.host;
      if (!host.isConnected) return;
      if (!data.ok) {
        host.innerHTML = `<h2>PUBLIC ARCHIVE / SOCIAL PREVIEW</h2><p role="status">ERROR · ${esc(publicationMessage(data.error))}</p><button onclick="loadPublication('${esc(state.dropId)}')">상태 다시 확인</button>`;
        return;
      }
      host.innerHTML = `<h2>PUBLIC ARCHIVE / SOCIAL PREVIEW</h2>
        <p class="eyebrow" id="publication-status" role="status">${esc(data.status)}</p>${publicationDiff(data)}
        <p>영구 공개 주소: <a href="https://accordbook.org/drop/${esc(data.snapshot.slug)}" target="_blank" rel="noopener">accordbook.org/drop/${esc(data.snapshot.slug)}</a></p>
        <p class="muted">저장·활성화와 별개로 명시적으로 발행합니다. 발행된 아카이브는 배포 기간이 끝나도 남습니다. SYNCED는 저장소 기준이며 실제 배포 완료를 뜻하지 않습니다.</p>
        <div class="publication-controls"><label><input type="radio" name="og-mode" value="AUTO" ${state.mode === 'AUTO' ? 'checked' : ''} onchange="changePublicationMode('AUTO')"> AUTO</label>
        <label><input type="radio" name="og-mode" value="CUSTOM" ${state.mode === 'CUSTOM' ? 'checked' : ''} onchange="changePublicationMode('CUSTOM')"> CUSTOM</label></div>
        <div id="publication-preview"></div>
        <div id="publication-upload"><label for="og-file">CUSTOM PNG · 최대 5 MiB</label><input id="og-file" type="file" accept="image/png" onchange="selectPublicationPng(this)"><p class="muted">최소 600 × 315, 최대 40 MP. 발행할 때만 업로드하며 빌드가 중앙 크롭하여 1200 × 630 PNG로 만듭니다.</p></div>
        <p class="muted">AUTO는 HTML/CSS 근사 미리보기입니다. 최종 PNG는 빌드 시 생성합니다. 공개 문구를 수정하려면 먼저 일반 편집에서 저장한 후 돌아오세요.</p>
        <p id="publication-message" class="publication-message" role="status" aria-live="polite">${!data.configured ? esc(publicationMessage('github_not_configured')) : !data.eligible ? esc(publicationMessage('not_publishable')) : ''}</p>
        <button id="publication-publish" onclick="publishArchive()">PUBLISH PUBLIC ARCHIVE</button>
        <button id="publication-refresh" onclick="loadPublication('${esc(state.dropId)}')">저장소 상태 다시 확인</button>`;
      updatePublicationPreview();
    }
    function updatePublicationPreview() {
      const s = publication;
      if (!s.host.isConnected) return;
      $('publication-upload').hidden = s.mode !== 'CUSTOM';
      const imageUrl = s.objectUrl || s.data.imageUrl;
      $('publication-preview').innerHTML = s.mode === 'AUTO' ? autoOgPreview(s.data.snapshot) : imageUrl ? `<img class="og-custom" src="${esc(imageUrl)}" alt="CUSTOM social preview — 중앙 크롭 근사 예시">` : '<p>미리볼 PNG를 선택하세요.</p>';
      const preview = $('publication-preview').querySelector?.('.og-preview');
      if (preview) {
        const canvas = preview.querySelector('.og-preview-canvas');
        const resize = () => { canvas.style.transform = `scale(${preview.clientWidth / 1200})`; };
        resize();
        s.previewObserver?.disconnect();
        s.previewObserver = typeof ResizeObserver === 'function' ? new ResizeObserver(resize) : null;
        s.previewObserver?.observe(preview);
      }
      $('publication-status').textContent = s.busy ? 'PUBLISHING' : s.data.status === 'ERROR' ? 'ERROR' : (s.file || s.mode !== s.data.mode) && s.data.configured ? 'CHANGES NOT PUBLISHED' : s.data.status;
      $('publication-publish').disabled = s.busy || s.validating || !s.data.configured || !s.data.eligible || (s.mode === 'CUSTOM' && !imageUrl);
      $('publication-refresh').disabled = s.busy;
      s.host.querySelectorAll('input').forEach(input => { input.disabled = s.busy; });
    }
    function changePublicationMode(mode) {
      if (publication.busy) return;
      publication.mode = mode;
      if (mode === 'AUTO') {
        if (publication.objectUrl) URL.revokeObjectURL(publication.objectUrl);
        publication.objectUrl = null; publication.file = null; $('og-file').value = '';
      }
      updatePublicationPreview();
    }
    async function selectPublicationPng(input) {
      const s = publication, file = input.files[0];
      if (!file || s.busy) return;
      const selection = {}; s.selection = selection; s.validating = true; updatePublicationPreview();
      let url;
      try {
        if (file.type !== 'image/png' || file.size > 5 * 1024 * 1024) throw new Error('invalid_png');
        url = URL.createObjectURL(file);
        const img = new Image(); img.src = url; await img.decode();
        if (img.naturalWidth < 600 || img.naturalHeight < 315 || img.naturalWidth * img.naturalHeight > 40000000) throw new Error('invalid_png');
        if (s !== publication || s.selection !== selection || !s.host.isConnected || s.mode !== 'CUSTOM') { URL.revokeObjectURL(url); return; }
        if (s.objectUrl) URL.revokeObjectURL(s.objectUrl);
        s.objectUrl = url; s.file = file; $('publication-message').textContent = 'PNG 선택됨 — 아직 업로드하지 않았습니다.';
      } catch (_) {
        if (url) URL.revokeObjectURL(url);
        if (s === publication && s.selection === selection && s.host.isConnected) { input.value = ''; $('publication-message').textContent = publicationMessage('invalid_png'); }
      } finally { if (s === publication && s.selection === selection && s.host.isConnected) { s.validating = false; updatePublicationPreview(); } }
    }
    async function publishArchive() {
      const s = publication;
      if (s.busy || s.validating || !s.data.configured || !s.data.eligible) return;
      if (!confirm('저장된 제목·설명·공개 기간을 영구 공개 아카이브로 발행할까요? GitHub 소스와 소셜 이미지가 한 커밋으로 변경됩니다. CUSTOM → AUTO는 기존 소스 PNG를 삭제합니다. 배포 완료는 별도로 확인해야 합니다.')) return;
      s.busy = true; updatePublicationPreview();
      const finish = result => {
        if (s !== publication || !s.host.isConnected) return;
        s.busy = false;
        if (result.ok) {
          s.data.status = result.status; s.data.mode = s.mode;
          s.file = null; s.data.eligible = false; // Refresh required before another request.
          $('publication-message').innerHTML = result.commitUrl ? `배포 요청됨. <a href="${esc(result.commitUrl)}" target="_blank" rel="noopener">커밋 확인</a> · Actions/실제 페이지에서 배포 완료를 확인하세요.` : '저장소 내용이 이미 동일합니다.';
        } else { s.data.status = 'ERROR'; $('publication-message').textContent = publicationMessage(result.error); }
        updatePublicationPreview();
      };
      try {
        const pngBase64 = s.mode === 'CUSTOM' && s.file ? await new Promise((resolve, reject) => {
          const reader = new FileReader(); reader.onload = () => resolve(String(reader.result).split(',')[1]); reader.onerror = reject; reader.readAsDataURL(s.file);
        }) : undefined;
        if (s !== publication || !s.host.isConnected) return;
        google.script.run.withSuccessHandler(finish).withFailureHandler(() => finish({ ok: false })).publishFormulaDropArchive(s.dropId, {
          mode: s.mode, head: s.data.head, updatedAt: s.data.updatedAt, ...(pngBase64 ? { pngBase64 } : {}) });
      } catch (_) { finish({ ok: false, error: 'invalid_png' }); }
    }

    loadDashboard();
  </script>
</body>
</html>
