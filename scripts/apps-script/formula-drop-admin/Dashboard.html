<!doctype html>
<html lang="ko">
<head>
  <base target="_top">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body { margin: 0; background: #eee8dc; color: #302a26; font: 15px Georgia, serif; }
    main { max-width: 1180px; margin: auto; padding: 36px 24px; }
    h1 { font-size: 32px; margin: 0 0 8px; }
    h2 { margin-top: 34px; border-top: 1px solid #c8bdad; padding-top: 22px; }
    .eyebrow, th { font: 700 12px monospace; letter-spacing: .12em; text-transform: uppercase; color: #895437; }
    .cards { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
    .card { border: 1px solid #c8bdad; padding: 18px; background: #f5f0e7; }
    .num { font-size: 30px; margin-top: 8px; }
    table { width: 100%; border-collapse: collapse; background: #f5f0e7; }
    th, td { text-align: left; padding: 12px; border-bottom: 1px solid #d8cdbd; }
    button { font: inherit; background: none; border: 1px solid #9e9283; padding: 10px 14px; cursor: pointer; }
    button:hover, button:focus { background: #e2d8ca; }
    .muted { color: #75695e; }
    .error { color: #8a3428; }
    label { display: block; margin: 14px 0 6px; font-weight: bold; }
    input, textarea { box-sizing: border-box; width: 100%; padding: 10px; margin-top: 6px; border: 1px solid #b8aa99; background: #faf7f0; color: #302a26; font: inherit; }
    textarea { min-height: 120px; resize: vertical; }
    .edit-form { max-width: 760px; margin-top: 24px; padding: 24px; border: 1px solid #c8bdad; background: #f5f0e7; }
    .status-meta { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; margin-top: 22px; }
    .status-meta > div { border: 1px solid #c8bdad; padding: 16px; background: #f5f0e7; }
    .status-meta strong { display: block; margin-top: 8px; font-size: 22px; font-weight: normal; }
    .status-meta small { display: block; margin-top: 8px; color: #75695e; }
    .status-note { color: #895437; margin: 14px 0 0; }
    .form-actions { margin-top: 22px; }
    button:disabled { cursor: wait; opacity: .55; }
    @media (max-width: 700px) {
      main { padding: 24px 14px; }
      .cards { grid-template-columns: repeat(2, 1fr); }
      table { font-size: 13px; display: block; overflow: auto; white-space: nowrap; }
      h1 { font-size: 26px; }
      .status-meta { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">Accordbook Formula Drop Admin · v13</div>
    <h1>Formula Drop 운영 대시보드</h1>
    <p id="state" class="muted">Formula Drop 데이터를 불러오는 중…</p>
    <section id="app"></section>
  </main>

  <script>
    const $ = (id) => document.getElementById(id);

    const esc = (value) => String(value ?? '').replace(/[&<>"']/g, (character) => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[character]));

    const percent = (value) => value == null ? '—' : `${Number(value).toFixed(1)}%`;

    function statusLabel(status, kind) {
      const rawLabels = { DRAFT: '초안 (DRAFT)', SCHEDULED: '공개 예정 (SCHEDULED)', ACTIVE: '활성화 (ACTIVE)', EXPIRED: '종료됨 (EXPIRED)' };
      const effectiveLabels = { DRAFT: '비공개 (DRAFT)', SCHEDULED: '공개 예정 (SCHEDULED)', ACTIVE: '공개 중 (ACTIVE)', EXPIRED: '종료됨 (EXPIRED)' };
      return (kind === 'effective' ? effectiveLabels : rawLabels)[status] || '설정 확인 필요 (INVALID)';
    }

    function statusMismatchMessage(rawStatus, effectiveStatus) {
      if (rawStatus === effectiveStatus) return '';
      if (effectiveStatus === 'EXPIRED') return '종료 시간이 지나 현재는 공개되지 않습니다.';
      if (effectiveStatus === 'SCHEDULED') return '시작 시간이 아직 되지 않아 현재는 공개되지 않습니다.';
      if (effectiveStatus === 'INVALID') return '공개 기간 설정을 확인해야 합니다.';
      return '관리 설정과 현재 공개 상태가 다릅니다.';
    }

    const labels = {
      source: '유입 경로',
      uniqueVisitors: '고유 방문자',
      uniqueDownloaders: '고유 다운로드 사용자',
      uniqueImporters: '고유 Import 사용자',
      reason: '실패 원인',
      count: '횟수',
    };

    function loadDashboard() {
      $('state').textContent = 'Formula Drop 데이터를 불러오는 중…';
      google.script.run
        .withSuccessHandler(renderDashboard)
        .withFailureHandler(() => {
          $('state').innerHTML = '<span class="error">대시보드 데이터를 불러오지 못했습니다.</span> <button onclick="loadDashboard()">다시 시도</button>';
        })
        .getFormulaDropDashboardData();
    }

    function metricCard(label, value) {
      return `<div class="card"><div class="eyebrow">${label}</div><div class="num">${value}</div></div>`;
    }

    function renderDashboard(data) {
      $('state').textContent = data.active.length ? '활성 Drop' : '활성 상태의 Formula Drop이 없습니다.';
      const active = data.active[0];
      const metrics = active?.metrics;

      let html = '<button onclick="createDraft()">새 Formula Drop 만들기</button>';
      if (active) {
        html += `<h2>활성 Drop</h2><p><b>${esc(active.dropId)}</b> · ${esc(active.title)} · ${esc(statusLabel(active.effectiveStatus, 'effective'))}</p><div class="cards">
          ${metricCard('고유 방문자', metrics.uniqueVisitors)}
          ${metricCard('고유 다운로드 사용자', metrics.uniqueDownloaders)}
          ${metricCard('고유 Import 사용자', metrics.uniqueImporters)}
          ${metricCard('방문 → 다운로드', percent(metrics.visitToDownload))}
          ${metricCard('다운로드 → Import', percent(metrics.downloadToImport))}
          ${metricCard('방문 → Import', percent(metrics.visitToImport))}
          ${metricCard('전체 다운로드', metrics.totalDownloads)}
          ${metricCard('Import 실패', metrics.importFailures)}
        </div>`;
      }

      html += `<h2>최근 Drop</h2><table><tr><th>Drop</th><th>제목</th><th>관리 설정</th><th>현재 공개 상태</th><th>방문자</th><th>다운로드</th><th>Import</th><th>방문 → Import</th></tr>`;
      html += data.drops.map((drop) => `<tr><td><button onclick="showDetail('${esc(drop.dropId)}')">${esc(drop.dropId)}</button></td><td>${esc(drop.title)}</td><td>${esc(statusLabel(drop.status, 'raw'))}</td><td>${esc(statusLabel(drop.effectiveStatus, 'effective'))}</td><td>${drop.metrics.uniqueVisitors}</td><td>${drop.metrics.uniqueDownloaders}</td><td>${drop.metrics.uniqueImporters}</td><td>${percent(drop.metrics.visitToImport)}</td></tr>`).join('');
      html += '</table>';
      $('app').innerHTML = html;
    }

    function showDetail(dropId) {
      google.script.run
        .withSuccessHandler(renderDetail)
        .withFailureHandler(() => alert('Drop 상세 데이터를 불러오지 못했습니다.'))
        .getFormulaDropDetail(dropId);
    }

    function createDraft() {
      google.script.run
        .withSuccessHandler((result) => result.ok ? openEditor(result.dropId) : alert('생성할 수 없습니다: ' + result.error))
        .withFailureHandler(() => alert('Drop 생성에 실패했습니다.'))
        .createFormulaDropDraft({});
    }

    function renderDetail(data) {
      const metrics = data.metrics;
      $('state').textContent = `${data.drop.dropId} · ${statusLabel(data.drop.effectiveStatus, 'effective')}`;
      window.adminDropSummaries = window.adminDropSummaries || {};
      window.adminDropSummaries[data.drop.dropId] = data.drop;
      const editButton = data.drop.status === 'EXPIRED' ? '' : `<button onclick="openEditor('${esc(data.drop.dropId)}')">Drop 편집</button>`;
      const actions = editButton + (data.drop.status === 'DRAFT' ? ` <button onclick="changeStatus('activate', '${esc(data.drop.dropId)}', '${esc(data.drop.updatedAt)}')">Drop 활성화</button> <button onclick="changeStatus('schedule', '${esc(data.drop.dropId)}', '${esc(data.drop.updatedAt)}')">예약하기</button>` : data.drop.status === 'SCHEDULED' ? ` <button onclick="changeStatus('activate', '${esc(data.drop.dropId)}', '${esc(data.drop.updatedAt)}')">Drop 활성화</button> <button onclick="changeStatus('draft', '${esc(data.drop.dropId)}', '${esc(data.drop.updatedAt)}')">초안으로 되돌리기</button>` : data.drop.status === 'ACTIVE' ? ` <button onclick="changeStatus('expire', '${esc(data.drop.dropId)}', '${esc(data.drop.updatedAt)}')">Drop 종료</button>` : '');
      const statusMessage = statusMismatchMessage(data.drop.status, data.drop.effectiveStatus);
      $('app').innerHTML = `<button onclick="loadDashboard()">← 대시보드로 돌아가기</button> ${actions}<h2>${esc(data.drop.dropId)}</h2><p>${esc(data.drop.title)}</p><div class="status-meta"><div><div class="eyebrow">관리 설정</div><strong>${esc(statusLabel(data.drop.status, 'raw'))}</strong><small>Admin에서 지정한 상태</small></div><div><div class="eyebrow">현재 공개 상태</div><strong>${esc(statusLabel(data.drop.effectiveStatus, 'effective'))}</strong><small>기간을 반영한 실제 공개 상태</small></div></div>${statusMessage ? `<p class="status-note">${esc(statusMessage)}</p>` : ''}<section class="card" style="margin-top:24px"><div class="eyebrow">LICENSE</div><p id="license-status-${esc(data.drop.dropId)}">STATUS · 확인 중…</p><button id="license-refresh-${esc(data.drop.dropId)}" onclick="refreshLicenseStatus('${esc(data.drop.dropId)}')">상태 새로고침</button><div id="license-actions-${esc(data.drop.dropId)}"></div></section><div class="cards">
        ${metricCard('고유 방문자', metrics.uniqueVisitors)}
        ${metricCard('고유 다운로드 사용자', metrics.uniqueDownloaders)}
        ${metricCard('고유 Import 사용자', metrics.uniqueImporters)}
        ${metricCard('전체 조회', metrics.totalViews)}
        ${metricCard('전체 다운로드', metrics.totalDownloads)}
        ${metricCard('반복 다운로드', metrics.repeatDownloads)}
        ${metricCard('Import 시도', metrics.importAttempts)}
        ${metricCard('Import 성공', metrics.totalImportSuccesses)}
        ${metricCard('Import 실패', metrics.importFailures)}
        ${metricCard('방문 → 다운로드', percent(metrics.visitToDownload))}
        ${metricCard('다운로드 → Import', percent(metrics.downloadToImport))}
        ${metricCard('방문 → Import', percent(metrics.visitToImport))}
      </div><h2>유입 경로별 분석</h2>${renderTable(data.sources, ['source', 'uniqueVisitors', 'uniqueDownloaders', 'uniqueImporters'])}<h2>Import 실패 원인</h2>${renderTable(data.failures, ['reason', 'count'])}`;
      refreshLicenseStatus(data.drop.dropId);
    }

    function licenseStatusLabel(result) {
      const labels = { active: 'ACTIVE', revoked: 'REVOKED', missing_license_id: 'NOT CONNECTED', not_found: 'NOT FOUND', license_not_found: 'NOT FOUND', registry_not_found: 'NOT FOUND', ambiguous_drop_license_mapping: 'CONFIGURATION ISSUE', ambiguous_license: 'CONFIGURATION ISSUE', registry_ambiguous: 'CONFIGURATION ISSUE', registry_not_configured: 'NOT CONFIGURED', registry_unavailable: 'UNAVAILABLE', registry_invalid_response: 'UNAVAILABLE', registry_unauthorized: 'AUTHORIZATION ERROR', authorization_failed: 'AUTHORIZATION ERROR', invalid_request: 'CONFIGURATION ISSUE' };
      return labels[result.error] || 'UNAVAILABLE';
    }

    function refreshLicenseStatus(dropId) {
      const statusNode = $('license-status-' + dropId);
      const button = $('license-refresh-' + dropId);
      if (!statusNode || !button || button.disabled) return;
      button.disabled = true;
      statusNode.textContent = 'STATUS · 확인 중…';
      google.script.run.withSuccessHandler((result) => {
        statusNode.textContent = result.ok ? 'STATUS · ' + result.status.toUpperCase() : 'STATUS · ' + licenseStatusLabel(result);
        renderLicenseActions(dropId, result);
        button.disabled = false;
      }).withFailureHandler(() => {
        statusNode.textContent = 'STATUS · UNAVAILABLE';
        renderLicenseActions(dropId, { ok: false, error: 'registry_unavailable' });
        button.disabled = false;
      }).getFormulaDropLicenseStatus(dropId);
    }

    function renderLicenseActions(dropId, result) {
      const node = $('license-actions-' + dropId); const drop = window.adminDropSummaries && window.adminDropSummaries[dropId];
      if (!node || !drop || !result || !result.ok || (result.status !== 'active')) { if (node) node.innerHTML = ''; return; }
      const label = drop.status === 'ACTIVE' ? 'CLOSE & REVOKE' : drop.status === 'EXPIRED' ? 'REVOKE LICENSE' : '';
      node.innerHTML = label ? `<button class="danger-action" onclick="requestLicenseRevoke('${esc(dropId)}', '${esc(drop.status)}', '${esc(drop.updatedAt)}')">${label}</button>` : '';
    }

    function requestLicenseRevoke(dropId, rawStatus, updatedAt) {
      const typed = prompt(`계속하려면 ${dropId} 를 정확히 입력하세요.\n이 작업은 되돌릴 수 없습니다.`);
      if (typed !== dropId) { if (typed !== null) alert('Drop ID가 일치하지 않습니다.'); return; }
      const method = rawStatus === 'ACTIVE' ? 'closeAndRevokeFormulaDrop' : 'retryFormulaDropLicenseRevoke';
      const args = rawStatus === 'ACTIVE' ? [dropId, updatedAt, typed] : [dropId, typed];
      const runner = google.script.run.withSuccessHandler(result => {
        if (result.ok) { alert('처리가 완료되었습니다.'); showDetail(dropId); }
        else if (result.result === 'partial') { alert('Drop은 종료되었지만 License revoke가 완료되지 않았습니다. 상세 화면에서 다시 시도해 주세요.'); showDetail(dropId); }
        else alert('처리할 수 없습니다: ' + result.error);
      }).withFailureHandler(() => alert('처리 중 오류가 발생했습니다.'));
      if (method === 'closeAndRevokeFormulaDrop') runner.closeAndRevokeFormulaDrop(args[0], args[1], args[2]);
      else runner.retryFormulaDropLicenseRevoke(args[0], args[1]);
    }

    function changeStatus(action, dropId, updatedAt) {
      if (!confirm('이 Drop의 상태를 변경하시겠습니까?')) return;
      const methods = { activate: 'activateFormulaDrop', schedule: 'scheduleFormulaDrop', draft: 'returnFormulaDropToDraft', expire: 'expireFormulaDrop' };
      google.script.run
        .withSuccessHandler((result) => result.ok ? showDetail(dropId) : alert('상태를 변경할 수 없습니다: ' + result.error))
        .withFailureHandler(() => alert('상태 변경에 실패했습니다.'))[methods[action]](dropId, updatedAt);
    }

    function openEditor(dropId) {
      google.script.run.withSuccessHandler((config) => {
        if (!config || config.dropId !== dropId || !['DRAFT', 'SCHEDULED', 'ACTIVE'].includes(config.status) || typeof config.title !== 'string') {
          alert('편집 데이터를 정상적으로 받지 못했습니다. 저장하지 말고 Admin 서버 코드를 확인해 주세요.');
          return;
        }
        renderEditor(config);
      }).withFailureHandler(() => alert('편집 정보를 불러오지 못했습니다.')).getFormulaDropAdminConfig(dropId);
    }

    function renderEditor(config) {
      window.editValidationErrors = {};
      window.editOperationalError = '';
      const lockedAssets = config.status !== 'DRAFT';
      const lockedStart = config.status === 'ACTIVE';
      const field = (label, name, value, type = 'text', disabled = false) => `<label>${label}<input id="edit-${name}" name="${name}" type="${type}" value="${esc(value || '')}" ${disabled ? 'disabled' : ''} aria-invalid="false" aria-describedby="error-${name}"></label><small id="error-${name}" class="error" hidden></small>`;
      $('app').innerHTML = `<button onclick="showDetail('${esc(config.dropId)}')">← 상세로 돌아가기</button><h2>Formula Drop 편집</h2><p>${esc(config.dropId)} · ${esc(config.status)}</p><form id="edit-form" onsubmit="saveEditor(event, '${esc(config.dropId)}', '${esc(config.updatedAt)}', '${esc(config.status)}')">${field('제목', 'title', config.title)}${field('부제목', 'subtitle', config.subtitle)}<label>설명<textarea id="edit-description" name="description" aria-invalid="false" aria-describedby="error-description">${esc(config.description || '')}</textarea></label><small id="error-description" class="error" hidden></small>${field('시작 시각', 'startAt', config.startAt, 'datetime-local', lockedStart)}${field('종료 시각', 'expiresAt', config.expiresAt, 'datetime-local')}${field('파일명', 'fileName', config.fileName, 'text', lockedAssets)}${field('파일 URL', 'fileUrl', config.fileUrl, 'url', lockedAssets)}${field('License ID', 'licenseId', config.licenseId, 'text', lockedAssets)}${field('공용 Access Name', 'publicAccessName', config.publicAccessName, 'text', lockedAssets)}${field('공용 전화번호 끝 4자리', 'publicAccessLast4', config.publicAccessLast4, 'text', lockedAssets)}${field('공용 PIN', 'publicAccessPin', config.publicAccessPin, 'text', lockedAssets)}<p id="edit-error" class="error" hidden></p><button type="button" onclick="showDetail('${esc(config.dropId)}')">취소</button> <button id="save-edit" type="submit">변경사항 저장</button></form>`;
      document.querySelectorAll('#edit-form input:not(:disabled), #edit-form textarea:not(:disabled)').forEach((element) => {
        element.addEventListener('input', () => validateEditorField(element.name));
        element.addEventListener('change', () => validateEditorField(element.name));
      });
    }

    function getEditorFieldValue(name) {
      return document.querySelector(`#edit-form [name="${name}"]`)?.value ?? '';
    }

    function validateEditorField(name) {
      const value = getEditorFieldValue(name);
      let message = '';
      if (name === 'title' && !value.trim()) message = '제목은 필수입니다.';
      if (name === 'publicAccessLast4' && value && !/^\d{4}$/.test(value)) message = '정확히 4자리 숫자여야 합니다.';
      if (name === 'publicAccessPin' && value && !/^\d{6}$/.test(value)) message = '정확히 6자리 숫자여야 합니다.';
      if (name === 'licenseId' && value && !/^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i.test(value)) message = '유효한 UUID가 아닙니다.';
      if (name === 'fileUrl' && value && !/^https:\/\/[^\s]+$/i.test(value)) message = 'HTTPS URL만 사용할 수 있습니다.';
      if (name === 'fileName' && value && !/\.accordbook$/i.test(value)) message = '.accordbook 파일명이어야 합니다.';
      if (name === 'expiresAt' && getEditorFieldValue('startAt') && value && new Date(value) <= new Date(getEditorFieldValue('startAt'))) message = '종료 시각은 시작 시각보다 늦어야 합니다.';
      if (message) window.editValidationErrors[name] = message;
      else delete window.editValidationErrors[name];
      renderEditorErrors();
      return message;
    }

    function renderEditorErrors() {
      const errors = window.editValidationErrors || {};
      document.querySelectorAll('[id^="error-"]').forEach((node) => {
        const name = node.id.slice('error-'.length);
        const message = errors[name] || '';
        node.textContent = message;
        node.hidden = !message;
      });
      Object.keys(errors).forEach((name) => {
        const field = document.querySelector(`#edit-form [name="${name}"]`);
        if (field) field.setAttribute('aria-invalid', 'true');
      });
      document.querySelectorAll('#edit-form [name]').forEach((field) => {
        if (!errors[field.name]) field.setAttribute('aria-invalid', 'false');
      });
      const general = $('edit-error');
      if (general) {
        general.textContent = window.editOperationalError || '';
        general.hidden = !window.editOperationalError;
      }
    }

    function saveEditor(event, dropId, expectedUpdatedAt, status) {
      event.preventDefault();
      const form = event.currentTarget;
      const value = name => form.elements[name]?.value ?? '';
      window.editValidationErrors = {};
      window.editOperationalError = '';
      ['title', 'publicAccessLast4', 'publicAccessPin', 'licenseId', 'fileUrl', 'fileName', 'expiresAt'].forEach(validateEditorField);
      if (Object.keys(window.editValidationErrors).length) return;
      renderEditorErrors();
      const button = $('save-edit'); button.disabled = true; button.textContent = '저장 중…';
      const patch = {}; ['title', 'subtitle', 'description', 'startAt', 'expiresAt', 'fileName', 'fileUrl', 'licenseId', 'publicAccessName', 'publicAccessLast4', 'publicAccessPin'].forEach(name => { const element = form.elements[name]; if (element && !element.disabled) patch[name] = element.value; });
      google.script.run.withSuccessHandler(result => { if (result.ok) { window.editValidationErrors = {}; window.editOperationalError = ''; showDetail(dropId); } else { button.disabled = false; button.textContent = '변경사항 저장'; window.editValidationErrors = result.fields || {}; window.editOperationalError = result.error === 'conflict' ? '이 Drop이 다른 창에서 변경되었습니다. 최신 내용을 다시 불러오세요.' : result.fields ? '' : '저장할 수 없습니다: ' + result.error; renderEditorErrors(); } }).withFailureHandler(() => { button.disabled = false; button.textContent = '변경사항 저장'; window.editOperationalError = '저장에 실패했습니다.'; renderEditorErrors(); }).updateFormulaDrop(dropId, expectedUpdatedAt, patch);
    }

    function renderTable(rows, columns) {
      if (!rows.length) return '<p class="muted">데이터가 없습니다.</p>';
      return `<table><tr>${columns.map((column) => `<th>${labels[column]}</th>`).join('')}</tr>${rows.map((row) => `<tr>${columns.map((column) => `<td>${esc(row[column])}</td>`).join('')}</tr>`).join('')}</table>`;
    }

    loadDashboard();
  </script>
</body>
</html>
