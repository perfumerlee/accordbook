<!doctype html>
<html><head><meta charset="utf-8"><title>Accordbook</title><script>
(function () {
  var path = window.location.pathname;
  if (!/^\/drop\/?(?:\d{4}-\d{3}\/?)?$/.test(path)) return;
  var route = path + window.location.search + window.location.hash;
  window.location.replace('/?__accordbook_route=' + encodeURIComponent(route));
}());
</script></head><body></body></html>
